name: Build Frida Server ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip git curl build-essential \
            unzip zip pkg-config libglib2.0-dev

      - name: Clone Frida
        run: |
          git clone --recurse-submodules https://github.com/frida/frida.git
          cd frida
          git submodule update --init --recursive

      - name: Install Frida build tools
        run: |
          cd frida
          pip3 install --upgrade pip
          pip3 install .
          pip3 install meson ninja

      - name: Build Frida Server for ARM64
        run: |
          cd frida
          make core-android-arm64

      - name: Upload built server
        uses: actions/upload-artifact@v3
        with:
          name: frida-server-arm64
          path: frida/build/tmp-*/frida-core/frida-server
