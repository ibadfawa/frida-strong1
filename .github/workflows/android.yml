name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Download Android NDK r25
      run: |
        curl -LO https://dl.google.com/android/repository/android-ndk-r25-linux.zip
        unzip android-ndk-r25-linux.zip
        echo ANDROID_NDK_ROOT=${PWD}/android-ndk-r25 >> $GITHUB_ENV

    

    
    - name: Download Android NDK r25
      run: ./configure --host=android-arm64

    - name: Make
      run: make

    - name: Upload frida-server-arm64
      uses: actions/upload-artifact@v3
      with:
        name: frida-server-arm64.xz
        path: frida/build/frida-android-arm64/bin/frida-server.xz


      
