name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Cekout
    - uses: actions/checkout@v4
    
    - name: Download Android NDK r25
      run: |
       curl -LO https://dl.google.com/android/repository/android-ndk-r25-linux.zip
       unzip android-ndk-r25-linux.zip
       echo ANDROID_NDK_ROOT=${PWD}/android-ndk-r25 >> $GITHUB_ENV

    

    
    - name: Download Android NDK r25
      run: ./configure --host=android-arm64

    - name: Make
      run: make

    - name: Upload build folder
    - uses: actions/upload-artifact@v3.1.3
      with:
        name: frida-build-folder
        path: ../frida/build

      
