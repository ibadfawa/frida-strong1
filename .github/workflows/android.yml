name: "Frida Android CI(thin)2"

on:
  workflow_dispatch:
    inputs:
      from:
        description: "Enter branch/tag to build frida from(Default : main)"
        required: false
        default: "main"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3.0.2

      - name: Setup node
        uses: actions/setup-node@v3.1.1
        with:
          node-version: 18

      - name: Setup JDK 1.8
        uses: actions/setup-java@v3.3.0
        with:
          java-version: 8
          distribution: adopt

      - name: Setup Python 3.10
        uses: actions/setup-python@v3.1.2
        with:
          python-version: "3.10"

      # use r25 ?
      - name: Download Android NDK r25
        run: |
          curl -LO https://dl.google.com/android/repository/android-ndk-r25-linux.zip
          unzip android-ndk-r25-linux.zip
          echo ANDROID_NDK_ROOT=${PWD}/android-ndk-r25 >> $GITHUB_ENV
      - name: configure 
        run: ./configure --host=android-arm64

      - name: Make
        run: make
      
      - name: Package build result for Android
        shell: bash
        run: |
          xz build 
      - name: uploading
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: build.xz
          compression-level: 0 # no compression
